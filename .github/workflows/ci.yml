name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 builds are available for Ubuntu 24.04, not 26.04.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q app.py helpers.py log_run.py reminder.py tests
      - name: Core smoke tests
        run: python tests/smoke_test.py
      - name: Isolated HTTP regression tests
        run: python tests/api_test.py
