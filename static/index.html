<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务运行台账 · RunLedger</title>
<style>
  :root{
    --blue:#2F6FB0; --blue-d:#255C93; --blue-l:#EDF3FA; --blue-b:#D2E1F1;
    --green:#3E9268; --green-l:#ECF5F1; --green-b:#CDE7DB;
    --orange:#C9722A; --orange-l:#FDF3E9; --orange-b:#F2DCC3;
    --red:#BF4235;   --red-l:#FBEEEC;   --red-b:#F0D2CD;
    --violet:#5C6FBF; --violet-l:#EEEFF9;
    --gray:#8A94A6; --sub:#69748A; --ink:#1E2836;
    --bg:#F4F6F9; --card:#FFFFFF; --line:#E5EAF1; --line-s:#EFF3F8; --text:#1E2836;
    --sh:0 1px 2px rgba(20,38,60,.04), 0 1px 3px rgba(20,38,60,.03);
    --sh-h:0 4px 14px rgba(20,38,60,.08);
    /* 手写体：标题走行楷（有笔锋），正文走楷书（小字号也认得出），
       数字和代码仍用无衬线／等宽，避免手写数字宽窄不齐把表格挤乱 */
    --f-hand:"LXGW WenKai","霞鹜文楷","STKaiti","华文楷体","KaiTi","楷体","楷体_GB2312","Microsoft YaHei",sans-serif;
    --f-title:"LXGW WenKai","霞鹜文楷","STXingkai","华文行楷","STKaiti","华文楷体","KaiTi","楷体",sans-serif;
    --f-num:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-size:14.5px;line-height:1.62;
       font-family:var(--f-hand);font-synthesis-weight:none;
       background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 30px;
         display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(140deg,#3B7FC4,#2A6299);box-shadow:0 2px 6px rgba(47,111,176,.28);}
  .logo svg{width:18px;height:18px;color:#fff;}
  header h1{font-family:var(--f-title);font-size:21px;line-height:1.25;margin:0;font-weight:400;
            letter-spacing:.8px;color:var(--ink);}
  header .sub{color:var(--sub);font-size:12.5px;margin-top:2px;letter-spacing:.2px;}
  .btn{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:8px;
       padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;
       box-shadow:0 1px 2px rgba(47,111,176,.22);transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;}
  .btn:hover{background:var(--blue-d);border-color:var(--blue-d);box-shadow:0 2px 8px rgba(47,111,176,.26);}
  .btn:active{transform:translateY(1px);box-shadow:none;}
  .btn.ghost{background:#fff;color:var(--sub);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue);}
  .btn.sm{padding:3px 9px;font-size:12px;border-radius:7px;}
  .btn.warn{background:#fff;color:var(--orange);border:1px solid var(--orange-b);box-shadow:none;}
  .btn.warn:hover{background:var(--orange-l);border-color:var(--orange);color:var(--orange);}
  main{padding:24px 30px 40px;max-width:1200px;margin:0 auto;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px 15px;
        display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh);
        transition:box-shadow .18s,transform .18s,border-color .18s;}
  .card:hover{box-shadow:var(--sh-h);transform:translateY(-1px);}
  .card .k{display:flex;align-items:center;gap:8px;}
  .card .ico{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
             background:var(--acc-l);color:var(--acc);}
  .card .ico svg{width:15px;height:15px;display:block;}
  .card .l{font-size:12.5px;color:var(--sub);font-weight:400;letter-spacing:.4px;}
  .card .n{font-family:var(--f-title);font-size:31px;line-height:1.05;font-weight:400;color:var(--acc);
           font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .card.run    {--acc:var(--blue);   --acc-l:var(--blue-l);}
  .card.pending{--acc:var(--orange); --acc-l:var(--orange-l);}
  .card.done   {--acc:var(--green);  --acc-l:var(--green-l);}
  .card.err    {--acc:var(--red);    --acc-l:var(--red-l);}
  .card.todo   {--acc:var(--violet); --acc-l:var(--violet-l);}
  .card.pending{background:linear-gradient(180deg,#FFFCF8 0%,#FFFFFF 72%);}
  .section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px;
           margin-bottom:18px;box-shadow:var(--sh);}
  .section h2{font-family:var(--f-title);font-size:17.5px;font-weight:400;margin:0 0 15px;
              display:flex;align-items:center;gap:9px;letter-spacing:.8px;color:var(--ink);line-height:1.3;}
  .section h2::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--blue);flex:0 0 auto;}
  #pendingSection h2::before{background:var(--orange);}
  #todoSection h2::before{background:var(--violet);}
  #allSection h2::before{background:var(--gray);}
  #doneSection h2::before{background:var(--green);}
  #urgentSection h2::before{background:var(--red);}
  .section h2.clickable{cursor:pointer;user-select:none;transition:color .15s;}
  .section h2.clickable:hover{color:var(--blue);}
  .badge{background:var(--orange-l);color:var(--orange);border:1px solid var(--orange-b);
         border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:700;line-height:18px;}
  .badge.blue{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b);}
  .badge.green{background:var(--green-l);color:var(--green);border-color:var(--green-b);}
  .badge.red{background:var(--red-l);color:var(--red);border-color:var(--red-b);}
  .pq-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);
          border-radius:10px;background:#fff;transition:background .15s,border-color .15s,box-shadow .15s;}
  .pq-row:hover{background:#FCFDFF;border-color:var(--blue-b);box-shadow:var(--sh);}
  .pq-row.urg{border-color:var(--red-b);background:linear-gradient(90deg,#FEF6F5,#FFFCFC);
              box-shadow:inset 3px 0 0 var(--red);}
  .pq-row.urg:hover{background:#FDF4F3;border-color:var(--red-b);}
  .pq-row .t{flex:1;font-weight:600;font-size:13.5px;color:var(--ink);min-width:0;}
  .pq-row .meta{color:var(--sub);font-size:12px;}
  .pq-row .over{color:var(--orange);font-weight:700;font-size:12.5px;
                background:var(--orange-l);border:1px solid var(--orange-b);border-radius:999px;padding:1px 9px;}
  .pq-row .main,.child .main{flex:1;min-width:0;}
  .pq-row .main .t{font-weight:600;font-size:13.5px;color:var(--ink);line-height:1.45;}
  .pq-row .main .meta{color:var(--sub);font-size:11.5px;margin-top:2px;}
  .pq-row .right,.child .right{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .btn.link{background:none;border:none;box-shadow:none;color:var(--gray);padding:3px 6px;font-weight:400;}
  .btn.link:hover{background:var(--blue-l);color:var(--blue);box-shadow:none;}
  .btn.link.danger:hover{background:var(--red-l);color:var(--red);}
  .btn.ok{background:#fff;color:var(--green);border:1px solid var(--green-b);box-shadow:none;}
  .btn.ok:hover{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 8px rgba(62,146,104,.24);}
  .todo-node{margin-bottom:7px;}
  .todo-node.hot > .pq-row{border-color:var(--orange-b);background:linear-gradient(90deg,#FFF8F1,#FFFDFB);
                            box-shadow:inset 3px 0 0 var(--orange);}
  /* 紧急：红色更强调，写在 hot 之后所以两者并存时红色优先 */
  .todo-node.urgent > .pq-row{border-color:var(--red-b);background:linear-gradient(90deg,#FEF6F5,#FFFCFC);
                              box-shadow:inset 3px 0 0 var(--red);}
  .child.urgent{border-color:var(--red-b);border-left-color:var(--red);background:#FEF8F7;}
  /* 旗标按钮：常驻但低调，标了才变红 */
  .flag{background:none;border:none;box-shadow:none;padding:0;margin-right:5px;cursor:pointer;
        color:#C9D1DC;display:inline-flex;align-items:center;vertical-align:-1px;
        transition:color .15s,transform .12s;flex:0 0 auto;}
  .flag svg{width:11px;height:11px;display:block;}
  .flag:hover{color:var(--red);transform:scale(1.18);}
  .flag.on{color:var(--red);}
  .flag.on:hover{transform:scale(1.18);}
  tr.urgent{background:#FEFAF9;}
  tr.urgent:hover{background:#FDF5F4;}
  label.ck{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);
           font-weight:400;cursor:pointer;user-select:none;margin:0;}
  input[type=checkbox]{width:15px;height:15px;margin:0;padding:0;border:none;box-shadow:none;
                       accent-color:var(--red);cursor:pointer;flex:0 0 auto;}
  .todo-children{margin-top:1px;}
  .toggle{display:inline-flex;width:16px;justify-content:center;cursor:pointer;color:var(--gray);
          font-size:10px;flex:0 0 auto;user-select:none;transition:color .15s;}
  .toggle:hover{color:var(--blue);}
  .toggle.empty{visibility:hidden;}
  .child{margin:5px 0 2px 14px;padding:8px 12px;border:1px solid var(--line-s);border-left:2px solid var(--line);
         border-radius:8px;background:#FAFBFD;display:flex;align-items:center;gap:10px;
         transition:background .15s,border-color .15s;}
  .child:hover{background:#F6F9FD;border-left-color:var(--blue-b);}
  .child .ct{font-size:13px;color:var(--ink);line-height:1.45;}
  .child .cmeta{color:var(--sub);font-size:11.5px;margin-top:2px;}
  .child .cd{font-size:12px;}
  .pmeta{font-weight:400;font-size:12px;color:var(--sub);margin-top:3px;}
  .empty{color:var(--gray);font-size:12.5px;padding:9px 2px;text-align:center;}
  .filters{display:flex;gap:9px;margin-bottom:13px;flex-wrap:wrap;align-items:center;}
  select,input,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);
         border-radius:8px;background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s;outline:none;}
  select:hover,input:hover,textarea:hover{border-color:#D5DDE8;}
  select:focus,input:focus,textarea:focus{border-color:var(--blue-b);box-shadow:0 0 0 3px rgba(47,111,176,.10);}
  table{width:100%;border-collapse:separate;border-spacing:0;}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line-s);vertical-align:top;}
  th{color:var(--sub);font-weight:600;font-size:11.5px;letter-spacing:.4px;background:#FAFBFD;
     border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1;}
  th:first-child{border-top-left-radius:9px;} th:last-child{border-top-right-radius:9px;}
  tbody tr{transition:background .13s;}
  tbody tr:hover{background:#FAFCFF;}
  tbody tr:last-child td{border-bottom:none;}
  .chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
        border:1px solid transparent;line-height:18px;white-space:nowrap;}
  .chip.待提交{background:#F2F4F7;color:var(--sub);border-color:var(--line);}
  .chip.运行中{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b);}
  .chip.待看结果{background:var(--orange-l);color:var(--orange);border-color:var(--orange-b);}
  .chip.待办{background:#F2F4F7;color:#5B677A;border-color:var(--line);}
  .chip.已完成{background:var(--green-l);color:var(--green);border-color:var(--green-b);}
  .chip.异常{background:var(--red-l);color:var(--red);border-color:var(--red-b);}
  .cd{font-variant-numeric:tabular-nums;font-size:13px;}
  .cd.run{color:var(--blue);} .cd.over{color:var(--orange);font-weight:700;}
  .type-tag{display:inline-block;padding:0 8px;border-radius:6px;font-size:11px;line-height:18px;
            background:var(--violet-l);color:var(--violet);border:1px solid #DFE3F4;white-space:nowrap;}
  .acts{display:flex;gap:5px;flex-wrap:wrap;}
  .task-cell{font-weight:600;color:var(--ink);max-width:400px;word-break:break-word;}
  tbody td:nth-child(2),tbody td:nth-child(3),tbody td:nth-child(4){white-space:nowrap;}
  .act-cell{color:var(--sub);font-size:12px;white-space:pre-wrap;max-width:320px;}
  .times{color:var(--sub);font-size:11.5px;line-height:1.75;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .anote{color:var(--sub);font-size:12px;margin-top:3px;white-space:pre-wrap;font-weight:400;line-height:1.5;}
  .rnote{color:var(--green);font-size:12px;margin-top:4px;white-space:pre-wrap;font-weight:400;line-height:1.5;
         background:var(--green-l);border-radius:6px;padding:3px 7px;display:block;width:fit-content;max-width:100%;}
  .rnote::before{content:"✓ ";font-weight:700;}
  mark{background:#FCE79B;color:inherit;border-radius:3px;padding:0 2px;}
  /* 已完成 · 按天回顾 */
  .day{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden;background:#fff;}
  .day:last-child{margin-bottom:0;}
  .day-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#FAFBFD;
         cursor:pointer;font-size:13px;user-select:none;transition:background .15s;}
  .day-h:hover{background:#F3F7FC;}
  .day-h.fold{border-radius:10px;}
  .day-h .d{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;font-size:13px;}
  .day-h .w{color:var(--sub);font-size:12px;}
  .day-h .n{margin-left:auto;color:var(--sub);font-size:11.5px;font-variant-numeric:tabular-nums;}
  .day-b{padding:0 13px 6px;border-top:1px solid var(--line-s);}
  .dn-item{padding:9px 0;border-bottom:1px dashed var(--line);}
  .dn-item:last-child{border-bottom:none;padding-bottom:3px;}
  .dn-t{font-size:13px;font-weight:600;color:var(--ink);}
  .dn-m{color:var(--sub);font-size:11.5px;margin-top:3px;}
  .dn-r{color:var(--green);font-size:12px;margin-top:4px;white-space:pre-wrap;font-weight:400;line-height:1.5;}
  .dn-r::before{content:"✓ ";font-weight:700;}
  .mask{position:fixed;inset:0;background:rgba(24,34,48,.38);backdrop-filter:blur(2px);
        display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .mask.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:22px 24px;width:520px;max-width:100%;
         box-shadow:0 16px 48px rgba(16,28,45,.18),0 2px 8px rgba(16,28,45,.06);
         animation:pop .18s ease-out;}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985);}to{opacity:1;transform:none;}}
  .modal h3{margin:0 0 16px;font-family:var(--f-title);font-size:19px;font-weight:400;
            color:var(--ink);letter-spacing:.8px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:500;}
  .field input,.field textarea,.field select{width:100%;}
  .field textarea{min-height:66px;resize:vertical;line-height:1.6;}
  .modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:10px;}
  .err{color:var(--red);font-size:12px;min-height:16px;}
  /* ---------- 速记侧栏 ---------- */
  body{padding-right:0;transition:padding-right .22s ease;}
  body.nr-open{padding-right:312px;}
  .note-rail{position:fixed;top:0;right:0;bottom:0;width:312px;background:var(--card);
             border-left:1px solid var(--line);box-shadow:-6px 0 26px rgba(20,38,60,.055);
             display:flex;flex-direction:column;z-index:40;
             transition:transform .24s cubic-bezier(.4,0,.2,1),box-shadow .24s;}
  .note-rail.fold{transform:translateX(100%);box-shadow:none;}
  .nr-head{display:flex;align-items:center;gap:8px;padding:15px 13px 11px 17px;
           border-bottom:1px solid var(--line-s);flex:0 0 auto;}
  .nr-head .h{font-family:var(--f-title);font-size:15.5px;font-weight:400;color:var(--ink);
              display:flex;align-items:center;gap:8px;letter-spacing:.8px;}
  .nr-head .h::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--violet);flex:0 0 auto;}
  .nr-head .sp{flex:1;}
  .badge.violet{background:var(--violet-l);color:var(--violet);border-color:#DFE3F4;}
  .nr-input{padding:12px 15px 11px;border-bottom:1px solid var(--line-s);flex:0 0 auto;}
  .nr-input textarea{width:100%;min-height:64px;resize:vertical;font-size:12.5px;line-height:1.6;}
  .nr-bar{display:flex;align-items:center;gap:7px;margin-top:7px;}
  .nr-hint{font-size:11px;color:var(--gray);flex:1;line-height:1.4;}
  .nr-list{flex:1;overflow-y:auto;padding:2px 15px 20px;}
  .nr-item{padding:10px 0;border-bottom:1px dashed var(--line);}
  .nr-item:last-child{border-bottom:none;}
  .nr-item .t{font-size:12.5px;line-height:1.58;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .nr-item .m{display:flex;align-items:center;gap:8px;margin-top:5px;}
  .nr-item .when{font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums;}
  .nr-item .ops{margin-left:auto;display:flex;gap:1px;opacity:.4;transition:opacity .15s;}
  .nr-item:hover .ops,.nr-item.editing .ops{opacity:1;}
  .nr-item.editing{background:var(--violet-l);margin:0 -7px;padding:10px 7px;border-radius:9px;border-bottom-color:transparent;}
  .nr-empty{color:var(--gray);font-size:12px;text-align:center;padding:26px 8px;line-height:1.9;}
  .note-tab{position:fixed;top:50%;right:0;transform:translateY(-50%);
            writing-mode:vertical-rl;letter-spacing:4px;font-size:12px;font-weight:600;
            padding:15px 9px;background:var(--card);color:var(--violet);font-family:inherit;
            border:1px solid var(--line);border-right:none;border-radius:10px 0 0 10px;
            box-shadow:-2px 0 12px rgba(20,38,60,.08);cursor:pointer;z-index:41;display:none;
            transition:background .15s,color .15s;}
  .note-tab.show{display:block;}
  .note-tab:hover{background:var(--violet-l);}
  @media (max-width:1180px){
    body.nr-open{padding-right:0;}
    .note-rail{box-shadow:-10px 0 36px rgba(20,38,60,.20);}
  }
  /* ---------- 手写体适配 ----------
     楷书的字形比雅黑瘦一圈，同等字号会显得小，所以正文小字统一放大半号到一号；
     数字、时间、日期一律走无衬线 tabular，不然手写数字宽窄不一会把表格列撑得参差。 */
  .badge,.chip,.type-tag{font-size:12px;font-weight:400;letter-spacing:.2px;}
  th{font-size:12px;font-weight:400;letter-spacing:1px;color:#59647A;}
  .pq-row .t,.pq-row .main .t,.child .ct,.task-cell,.dn-t{font-size:14px;font-weight:400;}
  .pq-row .main .meta,.child .cmeta,.act-cell,.anote,.rnote,.dn-r{font-size:12.5px;}
  .empty,.nr-empty,.field label,.filters{font-size:13px;}
  .field label{font-weight:400;}
  .times,.cd,.day-h .d,.day-h .n,.nr-item .when{font-family:var(--f-num);}
  .times{font-size:12.5px;}
  .cd{font-size:13.5px;font-weight:400;}
  /* 滚动条 */
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#D3DAE4;border-radius:8px;border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:#BCC6D4;}
  /* 窄屏 */
  @media (max-width:760px){
    header{padding:12px 16px;flex-wrap:wrap;}
    main{padding:16px 14px 30px;}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px;}
    .card .n{font-size:23px;}
    .section{padding:15px 14px 16px;}
    .pq-row{flex-wrap:wrap;}
    .task-cell{max-width:220px;}
    th,td{padding:9px 7px;}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M7 5h8M7 10h8M7 15h5"/>
        <circle cx="3.6" cy="5" r="1.05" fill="currentColor" stroke="none"/>

<script>
let PROJECTS = [];   // 由后端从台账里动态汇总，避免把项目名写死在代码里
const TYPES = ["运行任务","待办项"];
let editId = null;
let miniCb = null;

function fmtMin(m){
  if(m==null) return "—";
  m = Math.max(0, Math.round(m));
  const h = Math.floor(m/60), mm = m%60;
  return h>0 ? `${h}h${mm?(' '+mm+'m'):''}` : `${mm}m`;
}
function fmtTime(s){
  if(!s) return "—";
  const d = new Date(s);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 时间标签：创建（=开始时间）/ 完成 / 实际耗时
function timeMeta(r){
  const parts=[];
  if(r.start_at) parts.push(`创建 ${fmtTime(r.start_at)}`);
  if(r.done_at) parts.push(`完成 ${fmtTime(r.done_at)}`);
  return parts.length ? " · "+parts.join(" · ") : "";
}
function timeCell(r){
  const lines=[];
  if(r.start_at) lines.push(`创建 ${fmtTime(r.start_at)}`);
  if(r.done_at) lines.push(`完成 ${fmtTime(r.done_at)}`);
  if(r.elapsed_min!=null){
    let s=`耗时 ${fmtMin(r.elapsed_min)}`;
    if(r.est_minutes) s+=` / 预估 ${r.est_label}`;
    lines.push(s);
  }
  return lines.length ? lines.join("<br>") : "—";
}
async function api(path, method="GET", body=null){
  const opt={method};
  if(body){opt.headers={"Content-Type":"application/json"};opt.body=JSON.stringify(body);}
  const r = await fetch(path, opt);
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function fillSelects(){
  const fp=document.getElementById("fProject"), ft=document.getElementById("fType");
  // 筛选下拉：项目列表随台账变化，重建时保留当前选中项
  const cur = fp.value;
  fp.innerHTML = '<option value="">全部项目</option>';
  PROJECTS.forEach(p=>fp.appendChild(new Option(p,p)));
  fp.value = cur;
  // 新增/编辑弹窗：datalist 给候选，同时允许直接输入新项目名
  const dl = document.getElementById("projOptions");
  dl.innerHTML = "";
  PROJECTS.forEach(p=>dl.appendChild(new Option(p,p)));
  if(!ft.children.length) TYPES.forEach(t=>ft.appendChild(new Option(t,t)));
}
// ---- 全部任务：整块折叠（状态记在 localStorage，下次打开保持） ----
let allOpen = false;
try{ allOpen = localStorage.getItem("rt.all.open") === "1"; }catch(e){ allOpen = false; }
if(/[?&]all=1/.test(location.search)) allOpen = true;   // 支持「全部任务」直链展开
function applyAllState(){
  const body = document.getElementById("allBody");
  if(!body) return;
  body.style.display = allOpen ? "" : "none";
  document.getElementById("allArrow").textContent = allOpen ? "▼" : "▶";
  document.getElementById("allHint").textContent = allOpen ? "" : "点标题展开";
}
function toggleAll(){
  allOpen = !allOpen;
  try{ localStorage.setItem("rt.all.open", allOpen ? "1" : "0"); }catch(e){}
  applyAllState();
}
async function load(){
  try{
    const [list, sum] = await Promise.all([api("/api/runs"), api("/api/summary")]);
    window._runs = list.runs;   // 先赋值，后面几个 render 都要用它解析父任务名
    PROJECTS = list.projects || [];
    fillSelects();
    renderSummary(sum);
    renderUrgent(sum.urgent || []);
    renderPending(sum.pending);
    renderTodos(list.runs.filter(r=>r.type==="待办项" && r.status==="待办"));
    renderTable(list.runs);
    renderDone(list.runs);
    document.getElementById("allBadge").textContent = list.runs.length;
    document.getElementById("lastSync").textContent = "最近刷新 "+new Date().toLocaleTimeString();
  }catch(e){ console.error(e); }
}
function renderSummary(s){
  document.getElementById("cRun").textContent = s.counts["运行中"]||0;
  document.getElementById("cPending").textContent = s.counts["待看结果"]||0;
  document.getElementById("cDone").textContent = s.done_week||0;
  document.getElementById("cErr").textContent = s.counts["异常"]||0;
  document.getElementById("cTodo").textContent = s.todo_count||0;
}
const FLAG_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.7 1.5v9.1"/><path d="M2.7 2.2h6.2L7.4 4.3l1.5 2.1H2.7z"/></svg>';
function flagBtn(r){
  const on = !!r.urgent;
  return `<button class="flag${on?" on":""}" title="${on?"取消紧急标记":"标为紧急"}"
     onclick="toggleUrgent('${r.id}')">${FLAG_SVG}</button>`;
}
async function toggleUrgent(id){
  try{ await api(`/api/runs/${id}/urgent`,"POST"); load(); }
  catch(e){ console.error("紧急标记失败", e); }
}
// 紧急项在同级里排前面（其余保持创建时间顺序）
function urgentFirst(a,b){
  return ((b.urgent?1:0)-(a.urgent?1:0)) || String(a.created_at||"").localeCompare(String(b.created_at||""));
}
function renderUrgent(arr){
  const sec=document.getElementById("urgentSection"), box=document.getElementById("urgentList");
  if(!sec||!box) return;
  document.getElementById("urgentBadge").textContent = arr.length;
  if(!arr.length){ sec.style.display="none"; box.innerHTML=""; return; }
  sec.style.display="";
  box.innerHTML="";
  const all = window._runs||[];
  arr.forEach(r=>{
    const isRun=(r.type||"运行任务")==="运行任务";
    const pname = r.parent_id ? (all.find(x=>x.id===r.parent_id)||{}).task : "";
    const meta=[];
    if(pname) meta.push(`隶属 ${pname}`);
    meta.push(r.project);
    if(isRun && r.status==="运行中") meta.push(`剩 ${fmtMin(r.remaining_min)}`);
    if(isRun && r.status==="待看结果") meta.push(`已超时 ${fmtMin(r.overdue_min)}`);
    if(r.action) meta.push(r.action);
    let ops="";
    if(isRun && r.status==="待提交") ops+=`<button class="btn sm" onclick="doSubmit('${r.id}')">提交</button>`;
    else if(isRun && r.status==="异常") ops+=`<button class="btn sm warn" onclick="doRerun('${r.id}')">重跑</button>`;
    else ops+=`<button class="btn sm" onclick="doCheck('${r.id}')">${isRun?"看结果":"完成"}</button>`;
    ops+=`<button class="btn sm link danger" onclick="toggleUrgent('${r.id}')">取消标记</button>`;
    const div=document.createElement("div"); div.className="pq-row urg";
    div.innerHTML=`<div class="main">
        <div class="t">${flagBtn(r)}${esc(r.task)} <span class="chip ${r.status}">${r.status}</span></div>
        <div class="meta">${meta.map(esc).join(" · ")}</div>
      </div>
      <div class="right">${ops}</div>`;
    box.appendChild(div);
  });
}
function renderPending(arr){
  const box=document.getElementById("pendingList"), badge=document.getElementById("pqBadge");
  badge.textContent = arr.length;
  if(!arr.length){ box.innerHTML='<div class="empty">暂无待看结果的运行任务 ✓</div>'; return; }
  box.innerHTML="";
  arr.forEach(r=>{
    const pname = r.parent_id ? ((window._runs||[]).find(x=>x.id===r.parent_id)||{}).task : "";
    const div=document.createElement("div"); div.className="pq-row";
    div.innerHTML=`<div class="main">
        <div class="t">${esc(r.task)}</div>
        <div class="meta">${pname?('隶属 '+esc(pname)+' · '):''}${esc(r.project)} · 提交 ${fmtTime(r.submit_time)} · 预估 ${r.est_label}</div>
      </div>
      <div class="right">
        <span class="over">已超时 ${fmtMin(r.overdue_min)}</span>
        <button class="btn sm" onclick="doCheck('${r.id}')">去查看</button>
      </div>`;
    box.appendChild(div);
  });
}
function renderTodos(arr){
  // arr 只含「未完成」的待办项；已完成的从待办区移走（在「全部任务」里可查看/重开）
  const box=document.getElementById("todoList"), badge=document.getElementById("todoBadge");
  badge.textContent = arr.length;
  if(!arr.length){ box.innerHTML='<div class="empty">暂无待办项 ✓</div>'; return; }
  const all = window._runs||[];
  // 顶层 = 父节点不在未完成集合里（无父、父已完成或父已不存在），避免父已完成时子待办一起消失
  const topTodos = arr.filter(r=> !r.parent_id || !arr.some(x=>x.id===r.parent_id)).sort(urgentFirst);
  box.innerHTML="";
  topTodos.forEach(r=> renderTodoNode(r, all, 0, box));
}
const collapsed = new Set(); // 记录折叠的待办 id，刷新后保持
function toggleNode(id){
  if(collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
  load();
}
function isHot(todoId, all){
  return all.filter(k=>k.parent_id===todoId).some(k=>
    (k.type==="运行任务" && k.status==="待看结果") ||
    (k.type==="待办项" && isHot(k.id, all))
  );
}
function renderTodoNode(todo, all, depth, box){
  const hot = isHot(todo.id, all);
  const childTodos = all.filter(k=>k.parent_id===todo.id && k.type==="待办项" && k.status==="待办").sort(urgentFirst);
  // 已查看过（已完成）的运行任务不再占位，需要回看结果去「全部任务」里筛「已完成」
  const childRuns = all.filter(k=>k.parent_id===todo.id && k.type!=="待办项" && k.status!=="已完成").sort(urgentFirst);
  const hasChildren = childTodos.length>0 || childRuns.length>0;
  const isCollapsed = collapsed.has(todo.id);

  const node=document.createElement("div");
  node.className="todo-node"+(hot?" hot":"")+(todo.urgent?" urgent":"");
  const head=document.createElement("div"); head.className="pq-row";
  head.style.marginLeft=(depth*22)+"px";
  const arrow = hasChildren
    ? `<span class="toggle" onclick="toggleNode('${todo.id}')" title="折叠/展开">${isCollapsed?'▶':'▼'}</span>`
    : `<span class="toggle empty"></span>`;
  const parts=[];
  if(childTodos.length) parts.push(`${childTodos.length} 子待办`);
  if(childRuns.length) parts.push(`${childRuns.length} 运行`);
  const cnt = parts.length ? ` · ${parts.join(" / ")}` : "";
  head.innerHTML=`${arrow}
    <div class="main">
      <div class="t">${flagBtn(todo)}${esc(todo.task)}</div>
      <div class="meta">${esc(todo.project)}${todo.action?(' · '+esc(todo.action)):''}${cnt}${timeMeta(todo)}</div>
    </div>
    <div class="right">
      <button class="btn sm link" onclick="openAdd('${todo.id}','待办项')">+ 子待办</button>
      <button class="btn sm link" onclick="openAdd('${todo.id}')">+ 运行任务</button>
      <button class="btn sm ok" onclick="doCheck('${todo.id}')">完成</button>
      <button class="btn sm link danger" onclick="doDelete('${todo.id}')">删</button>
    </div>`;
  node.appendChild(head);

  if(hasChildren && !isCollapsed){
    const children=document.createElement("div"); children.className="todo-children";
    childTodos.forEach(k=> renderTodoNode(k, all, depth+1, children));
    childRuns.forEach(k=>{
      const c=document.createElement("div"); c.className="child"+(k.urgent?" urgent":"");
      c.style.marginLeft=((depth+1)*22+14)+"px";
      let cd, act="";
      if(k.status==="运行中") cd=`<span class="cd run">剩 ${fmtMin(k.remaining_min)}</span>`;
      else if(k.status==="待看结果") cd=`<span class="cd over">已超时 ${fmtMin(k.overdue_min)}</span>`;
      else if(k.est_label) cd=`<span class="cmeta">${k.est_label}</span>`;
      if(k.status==="运行中"||k.status==="待看结果") act=`<button class="btn sm" onclick="doCheck('${k.id}')">去查看</button>`;
      else if(k.status==="待提交") act=`<button class="btn sm" onclick="doSubmit('${k.id}')">提交</button>`;
      act += `<button class="btn sm link danger" onclick="doDelete('${k.id}')">删</button>`;
      const ktime=[];
      if(k.start_at) ktime.push(`创建 ${fmtTime(k.start_at)}`);
      if(k.done_at) ktime.push(`完成 ${fmtTime(k.done_at)}`);
      c.innerHTML=`<div class="main">
          <div class="ct">↳ ${flagBtn(k)}${esc(k.task)} <span class="chip ${k.status}">${k.status}</span></div>
          ${ktime.length?`<div class="cmeta">${ktime.join(" · ")}</div>`:""}
        </div>
        <div class="right">${cd}<div class="acts">${act}</div></div>`;
      children.appendChild(c);
    });
    node.appendChild(children);
  }
  box.appendChild(node);
}
function hl(s){
  // 先转义再高亮，避免破坏 HTML；关键字为正则元字符时降级为纯转义
  const kw = document.getElementById("fKw").value.trim();
  const t = esc(s);
  if(!kw) return t;
  try{
    const re = new RegExp("("+kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    return t.replace(re,"<mark>$1</mark>");
  }catch(e){ return t; }
}
function renderTable(runs){
  const fp=document.getElementById("fProject").value, fs=document.getElementById("fStatus").value, ft=document.getElementById("fType").value;
  const fu=document.getElementById("fUrgent").checked;
  const kw=document.getElementById("fKw").value.trim().toLowerCase();
  const tb=document.getElementById("tbody");
  let rows = runs.filter(r=>(!fp||r.project===fp)&&(!fs||r.status===fs)&&(!ft||(r.type||"运行任务")===ft)&&(!fu||r.urgent));
  if(kw) rows = rows.filter(r=>[r.task,r.action,r.result_note,r.project]
      .some(v=>String(v||"").toLowerCase().includes(kw)));
  if(!rows.length){ tb.innerHTML='<tr><td colspan="7" class="empty">没有符合条件的任务</td></tr>'; return; }
  tb.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    if(r.urgent) tr.className="urgent";
    const isRun = (r.type||"运行任务")==="运行任务";
    const pname = r.parent_id ? ((window._runs||[]).find(x=>x.id===r.parent_id)||{}).task : "";
    let cd = "—";
    if(isRun && r.status==="运行中") cd=`<span class="cd run">剩 ${fmtMin(r.remaining_min)}</span>`;
    else if(isRun && r.status==="待看结果") cd=`<span class="cd over">已超时 ${fmtMin(r.overdue_min)}</span>`;
    const subs=[];
    if(pname) subs.push(`<div class="pmeta">↳ 隶属：${esc(pname)}</div>`);
    if(r.action) subs.push(`<div class="anote">动作：${hl(r.action)}</div>`);
    if(r.result_note) subs.push(`<div class="rnote">${hl(r.result_note)}</div>`);
    tr.innerHTML=`
      <td class="task-cell">${flagBtn(r)}${hl(r.task)}${subs.join("")}</td>
      <td>${esc(r.project)}</td>
      <td><span class="type-tag">${esc(r.type||"运行任务")}</span></td>
      <td><span class="chip ${r.status}">${r.status}</span></td>
      <td class="cd">${cd}</td>
      <td class="times">${timeCell(r)}</td>
      <td><div class="acts">${actionBtns(r)}</div></td>`;
    tb.appendChild(tr);
  });
}
// ---- 已完成 · 按天回顾（回看结果备注的主要入口） ----
const dayFold = new Set();
let doneInited = false;
const WD = ["周日","周一","周二","周三","周四","周五","周六"];
function ymd(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function renderDone(runs){
  const box=document.getElementById("doneList");
  const done=runs.filter(r=>r.status==="已完成");
  document.getElementById("doneBadge").textContent=done.length;
  if(!done.length){ box.innerHTML='<div class="empty">暂无已完成记录</div>'; return; }

  const groups=new Map();
  done.forEach(r=>{
    const k = r.done_at ? String(r.done_at).slice(0,10) : "";
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(r);
  });
  // 有日期的按倒序在前；无 done_at 的老数据归到最后一组「日期未知」，避免漏看
  const keys=[...groups.keys()].filter(k=>k).sort().reverse();
  if(groups.has("")) keys.push("");
  // 首次渲染只展开最近 3 天，更早的默认折叠；之后按用户点开的状态保持
  if(!doneInited){ keys.slice(3).forEach(k=>dayFold.add(k)); doneInited=true; }

  const today=ymd(new Date());
  box.innerHTML="";
  keys.forEach(k=>{
    const list=groups.get(k).slice().sort((a,b)=>String(b.done_at||"").localeCompare(String(a.done_at||"")));
    const dObj=k?new Date(k+"T00:00:00"):null;
    const fold=dayFold.has(k);
    const day=document.createElement("div"); day.className="day";

    const head=document.createElement("div");
    head.className="day-h"+(fold?" fold":"");
    head.innerHTML=`<span class="toggle">${fold?'▶':'▼'}</span>` + (dObj
      ? `<span class="d">${dObj.getMonth()+1}/${dObj.getDate()}</span>
         <span class="w">${WD[dObj.getDay()]}${k===today?' · 今天':''}</span>
         <span class="n">${list.length} 项</span>`
      : `<span class="d">日期未知</span>
         <span class="w">早期手工录入，无完成时间</span>
         <span class="n">${list.length} 项</span>`);
    head.onclick=()=>{ if(fold) dayFold.delete(k); else dayFold.add(k); renderDone(window._runs||[]); };
    day.appendChild(head);

    if(!fold){
      const body=document.createElement("div"); body.className="day-b";
      list.forEach(r=>{
        const pname = r.parent_id ? ((window._runs||[]).find(x=>x.id===r.parent_id)||{}).task : "";
        const meta=[];
        if(pname) meta.push(`↳ 隶属：${esc(pname)}`);
        meta.push(esc(r.project));
        if(r.elapsed_min!=null) meta.push(`耗时 ${fmtMin(r.elapsed_min)}`+(r.est_minutes?` / 预估 ${r.est_label}`:""));
        const tm=(fmtTime(r.done_at).split(" ")[1]||"");
        if(tm) meta.push(`完成 ${tm}`);
        const it=document.createElement("div"); it.className="dn-item";
        it.innerHTML=`<div class="dn-t">${esc(r.task)}</div>
          <div class="dn-m">${meta.join(" · ")}</div>
          ${r.result_note?`<div class="dn-r">${esc(r.result_note)}</div>`:""}`;
        body.appendChild(it);
      });
      day.appendChild(body);
    }
    box.appendChild(day);
  });
}
function actionBtns(r){
  const isRun = (r.type||"运行任务")==="运行任务";
  let h="";
  if(isRun){
    if(r.status==="待提交") h+=`<button class="btn sm" onclick="doSubmit('${r.id}')">提交</button>`;
    if(r.status==="运行中"||r.status==="待看结果") h+=`<button class="btn sm" onclick="doCheck('${r.id}')">看结果</button>`;
    if(r.status!=="待提交") h+=`<button class="btn sm warn" onclick="doRerun('${r.id}')">重跑</button>`;
  } else {
    if(r.status==="待办") h+=`<button class="btn sm" onclick="doCheck('${r.id}')">完成</button>`;
    if(r.status==="已完成") h+=`<button class="btn sm warn" onclick="doReopen('${r.id}')">重开</button>`;
  }
  h+=`<button class="btn sm ghost" onclick="openEdit('${r.id}')">编辑</button>`;
  h+=`<button class="btn sm ghost" onclick="doDelete('${r.id}')">删</button>`;
  return h;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function doSubmit(id){ await api(`/api/runs/${id}/submit`,"POST"); load(); }
async function doRerun(id){ await api(`/api/runs/${id}/rerun`,"POST"); load(); }
async function doReopen(id){ await api(`/api/runs/${id}/reopen`,"POST"); load(); }
function doCheck(id){
  openMini("标记完成 / 查看结果", true, "确定", async ()=>{
    const note = document.getElementById("miniNoteInput").value.trim();
    await api(`/api/runs/${id}/check`,"POST",{result_note:note});
    load();
  });
}
function doDelete(id){
  const all = window._runs||[];
  const rec = all.find(x=>x.id===id);
  const name = rec ? `「${rec.task}」` : `（${id}）`;
  const countDesc = pid => all.filter(x=>x.parent_id===pid)
                              .reduce((n,k)=>n+1+countDesc(k.id), 0);
  const n = countDesc(id);
  const title = n>0
    ? `确认删除${name}？其下 ${n} 个下级（子待办 / 挂的运行任务）会一并删除，不可撤销。`
    : `确认删除${name}？此操作不可撤销。`;
  openMini(title, false, "删除", async ()=>{
    await api(`/api/runs/${id}`,"DELETE");
    load();
  });
}
function openMini(title, withNote, confirmText, cb){
  document.getElementById("miniTitle").textContent = title;
  document.getElementById("miniNote").style.display = withNote ? "" : "none";
  document.getElementById("miniNoteInput").value = "";
  document.getElementById("miniConfirm").textContent = confirmText;
  miniCb = cb;
  document.getElementById("miniMask").classList.add("show");
}
function closeMini(){ document.getElementById("miniMask").classList.remove("show"); miniCb = null; }
// modal
function toggleTypeRows(){
  const t=document.getElementById("fTypeModal").value;
  const isRun = t==="运行任务";
  document.getElementById("rowEst").style.display = isRun?"":"none";
  document.getElementById("rowJob").style.display = isRun?"":"none";
  const parentShow = (isRun || t==="待办项") ? "" : "none";
  document.getElementById("rowParent").style.display = parentShow;
  if(parentShow==="") fillParentSelect();
}
function fillParentSelect(){
  const sel=document.getElementById("fParent"), cur=sel.value;
  const all = window._runs||[];
  sel.innerHTML='<option value="">（不隶属，顶级待办 / 独立运行任务）</option>';
  all.forEach(r=>{
    if(r.type==="待办项" && r.status==="待办" && r.id!==editId){
      const o=document.createElement("option");
      o.value=r.id; o.textContent=r.task; sel.appendChild(o);
    }
  });
  // 兜底：当前父节点若不在候选里（已完成 / 已非待办），补进列表并标状态，
  // 否则 select 会回落到「不隶属」，一保存就把父关系误清空。
  if(cur && !all.some(r=>r.id===cur && r.type==="待办项" && r.status==="待办")){
    const p=all.find(r=>r.id===cur);
    if(p){
      const o=document.createElement("option");
      o.value=p.id; o.textContent=`${p.task}（${p.status}）`;
      sel.appendChild(o);
    }
  }
  if(cur) sel.value=cur;
}
function openAdd(fromTodo, childType){
  editId=null; document.getElementById("modalTitle").textContent="新增";
  ["fTask","fAction","fJob","fEst"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fParent").value="";
  document.getElementById("fUrgentChk").checked=false;
  document.getElementById("fTypeModal").value = childType || "运行任务";
  if(fromTodo){
    const p = window._runs?.find(x=>x.id===fromTodo);
    if(p) document.getElementById("fProj").value=p.project;
    document.getElementById("fParent").value=fromTodo;
  } else {
    document.getElementById("fProj").value = document.getElementById("fProject").value || "";
  }
  document.getElementById("formErr").textContent="";
  toggleTypeRows();
  document.getElementById("mask").classList.add("show");
}
function openEdit(id){
  editId=id; const r = window._runs?.find(x=>x.id===id);
  document.getElementById("modalTitle").textContent="编辑";
  if(r){
    document.getElementById("fTypeModal").value=r.type||"运行任务";
    document.getElementById("fTask").value=r.task;
    document.getElementById("fProj").value=r.project;
    document.getElementById("fAction").value=r.action||"";
    document.getElementById("fJob").value=r.job_id||"";
    document.getElementById("fEst").value=r.est_label||"";
    document.getElementById("fParent").value=r.parent_id||"";
    document.getElementById("fUrgentChk").checked=!!r.urgent;
  }
  document.getElementById("formErr").textContent="";
  toggleTypeRows();
  document.getElementById("mask").classList.add("show");
}
async function save(){
  const type=document.getElementById("fTypeModal").value;
  const body={
    type:type,
    task:document.getElementById("fTask").value.trim(),
    project:document.getElementById("fProj").value,
    action:document.getElementById("fAction").value.trim(),
    job_id:document.getElementById("fJob").value.trim(),
    parent_id:document.getElementById("fParent").value,
    urgent:document.getElementById("fUrgentChk").checked
  };
  if(type==="运行任务") body.est_label=document.getElementById("fEst").value.trim();
  const err=document.getElementById("formErr");
  if(!body.task){err.textContent="任务名不能为空";return;}
  if(type==="运行任务" && !body.est_label){err.textContent="运行任务需要填预估时长";return;}
  try{
    if(editId) await api(`/api/runs/${editId}`,"PUT",body);
    else await api("/api/runs","POST",body);
    document.getElementById("mask").classList.remove("show");
    load();
  }catch(e){ err.textContent=e.message; }
}
// ---------- 速记 ----------
let NOTES = [];
let noteEditId = null;
let noteOpen = true;
try{
  const v = localStorage.getItem("rt.note.open");
  noteOpen = (v === null) ? window.innerWidth >= 1180 : v === "1";
}catch(e){ noteOpen = window.innerWidth >= 1180; }

function applyNoteState(){
  const rail=document.getElementById("noteRail"), tab=document.getElementById("noteTab");
  if(!rail) return;
  rail.classList.toggle("fold", !noteOpen);
  tab.classList.toggle("show", !noteOpen);
  document.body.classList.toggle("nr-open", noteOpen);   // 展开时给主内容让出宽度，避免遮挡
}
function toggleNotes(){
  noteOpen = !noteOpen;
  try{ localStorage.setItem("rt.note.open", noteOpen ? "1" : "0"); }catch(e){}
  applyNoteState();
  if(noteOpen) document.getElementById("noteText").focus();
}
function fmtNoteTime(s){
  if(!s) return "";
  const d = new Date(s);
  if(isNaN(d)) return "";
  const now = new Date(), p = n=>String(n).padStart(2,'0');
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const same = (a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  if(same(d,now)) return "今天 "+hm;
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(same(d,y)) return "昨天 "+hm;
  return `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
function renderNotes(){
  const box=document.getElementById("noteList");
  if(!box) return;
  document.getElementById("noteBadge").textContent = NOTES.length;
  if(!NOTES.length){
    box.innerHTML='<div class="nr-empty">还没有速记<br>讨论完随手记一句，回头能翻到</div>';
    return;
  }
  box.innerHTML="";
  NOTES.forEach(n=>{
    const div=document.createElement("div");
    div.className="nr-item"+(n.id===noteEditId?" editing":"");
    div.innerHTML=`<div class="t">${esc(n.text)}</div>
      <div class="m"><span class="when">${fmtNoteTime(n.created_at)}</span>
        <div class="ops">
          <button class="btn sm link" onclick="editNote('${n.id}')">改</button>
          <button class="btn sm link danger" onclick="delNote('${n.id}')">删</button>
        </div>
      </div>`;
    box.appendChild(div);
  });
}
async function loadNotes(){
  try{
    const d = await api("/api/notes");
    NOTES = d.notes || [];
    renderNotes();
  }catch(e){ console.error("速记加载失败", e); }
}
function resetNoteInput(){
  noteEditId = null;
  document.getElementById("noteText").value = "";
  document.getElementById("noteSave").textContent = "记下";
  document.getElementById("noteCancel").style.display = "none";
  document.getElementById("noteHint").textContent = "Enter 保存 · Shift+Enter 换行";
}
function editNote(id){
  const n = NOTES.find(x=>x.id===id);
  if(!n) return;
  noteEditId = id;
  const ta = document.getElementById("noteText");
  ta.value = n.text;
  ta.focus();
  document.getElementById("noteSave").textContent = "更新";
  document.getElementById("noteCancel").style.display = "";
  document.getElementById("noteHint").textContent = "正在修改 · " + fmtNoteTime(n.created_at);
  renderNotes();
}
async function saveNote(){
  const ta = document.getElementById("noteText");
  const text = ta.value.trim();
  if(!text){ ta.focus(); return; }
  const btn = document.getElementById("noteSave");
  btn.disabled = true;
  try{
    if(noteEditId) await api(`/api/notes/${noteEditId}`, "PUT", {text});
    else await api("/api/notes", "POST", {text});
    resetNoteInput();
    await loadNotes();
    ta.focus();
  }catch(e){
    console.error(e);
    document.getElementById("noteHint").textContent = "保存失败：" + e.message;
  }finally{ btn.disabled = false; }
}
function delNote(id){
  openMini("确认删除这条速记？不可撤销。", false, "删除", async ()=>{
    await api(`/api/notes/${id}`, "DELETE");
    if(noteEditId === id) resetNoteInput();
    await loadNotes();
  });
}

// init
fillSelects();
applyAllState();
document.getElementById("allHead").onclick=toggleAll;
document.getElementById("addBtn").onclick=()=>openAdd();
document.getElementById("cancelBtn").onclick=()=>document.getElementById("mask").classList.remove("show");
document.getElementById("miniCancel").onclick=closeMini;
document.getElementById("miniConfirm").onclick=async()=>{ const cb=miniCb; closeMini(); if(cb) await cb(); };
document.getElementById("saveBtn").onclick=save;
document.getElementById("fTypeModal").onchange=toggleTypeRows;
document.getElementById("fProject").onchange=load;
document.getElementById("fType").onchange=load;
document.getElementById("fStatus").onchange=load;
document.getElementById("fKw").oninput=()=>renderTable(window._runs||[]);
document.getElementById("fUrgent").onchange=()=>renderTable(window._runs||[]);
// 速记
document.getElementById("noteFold").onclick=toggleNotes;
document.getElementById("noteTab").onclick=toggleNotes;
document.getElementById("noteSave").onclick=saveNote;
document.getElementById("noteCancel").onclick=resetNoteInput;
document.getElementById("noteText").addEventListener("keydown", e=>{
  // isComposing：中文输入法选词时的回车不能当保存
  if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); saveNote(); }
  if(e.key==="Escape" && noteEditId){ resetNoteInput(); renderNotes(); }
});
applyNoteState();
loadNotes();
load();
setInterval(load, 30000);
// 速记只在输入框空闲时静默刷新，避免打断正在输入的内容
setInterval(()=>{
  if(!noteEditId && !document.getElementById("noteText").value.trim()) loadNotes();
}, 60000);
</script>
